[package]
name = "lastmile"
version = "0.2.0-exp.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
mail-parser = "0.11.9"
mime_guess = "2.0.5"
openidconnect = { version = "4", default-features = false }
prometheus-client = "0.25"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "v5"] }

axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie-private", "form"] }
askama = "0.16"
time = "0.3"
flate2 = "1.1.10"
similar = "3.2.0"
chromiumoxide = { version = "0.9.1", default-features = false }
futures = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
chrono = "0.4"
http-body-util = "0.1.5"
insta = { version = "1.48.0", features = ["filters"] }
playwright-rs = { version = "=0.18.1", default-features = false, features = ["aws-lc", "route-service", "screenshot-diff"] }
rand08 = { package = "rand", version = "0.8" }
rsa = "0.9"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
