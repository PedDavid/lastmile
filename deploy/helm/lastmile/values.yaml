image:
  repository: ghcr.io/peddavid/lastmile
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Public URL of the UI (OIDC redirect, Origin checks).
publicUrl: https://parcels.example.com

oidc:
  issuer: ""            # e.g. https://auth.example.com/application/o/lastmile/
  clientId: lastmile
  # Secret holding the client secret (leave empty for public clients).
  clientSecret:
    existingSecret: ""
    key: client-secret
  scopes: "profile email groups"
  adminClaim: groups
  adminValue: lastmile-admins
  sessionTtl: 30d

# The model that drafts rules from inbox messages (docs/llm.md). Off until
# `model` is set. Any OpenAI-compatible API: OpenAI, or a self-hosted server
# (Ollama, vLLM, llama.cpp, LM Studio).
llm:
  model: ""
  baseUrl: https://api.openai.com/v1
  api: chat            # chat | responses
  structured: schema   # schema | json | none
  timeout: 120s
  apiKey:
    # Secret holding the API key (empty for a server without authentication).
    existingSecret: ""
    key: api-key

# A Presidio analyzer that finds names and places in a message beyond the
# household values (docs/llm.md). Off by default. It is sent the original
# message, so keep it in the cluster: `enabled` starts one with this release,
# or `url` points at one that already runs.
presidio:
  enabled: false
  url: ""
  # The stock image knows English only (spaCy en_core_web_lg); another
  # language needs your own image and NLP configuration.
  language: en
  entities: PERSON,LOCATION
  score: "0.5"
  timeout: 10s
  # Used when `enabled`.
  image:
    repository: mcr.microsoft.com/presidio-analyzer
    tag: 2.2.362
    pullPolicy: IfNotPresent
  port: 3000
  workers: 1
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

# Key encrypting session cookies. Generated once and kept across upgrades
# unless an existing Secret (with key `cookie-key`, >= 64 bytes) is given.
cookieKey:
  existingSecret: ""

# The SQLite database. Packages are data the app creates, so they live on a
# volume: back it up with the rest of your volumes.
persistence:
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  size: 1Gi
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  # Kept on `helm uninstall` so the packages survive a reinstall.
  keep: true

# A package with no news for this long needs attention.
staleAfter: 7d
# Delivered packages are archived this long after delivery.
archiveAfter: 7d
# Message text (personal data) is deleted this long after it came in.
messageRetention: 30d

# Development only: every visitor is an admin.
insecureDevAuth: false

service:
  # Applies to the UI only. Metrics and health checks always get a separate
  # ClusterIP Service (<fullname>-metrics).
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: parcels.example.com
  tls: []

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}

# Numeric IDs are required: with runAsNonRoot the kubelet cannot verify a
# non-numeric image USER. 65532 is distroless's `nonroot`; fsGroup makes the
# volume writable for it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

logJson: true
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
