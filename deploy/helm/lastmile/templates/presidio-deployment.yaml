{{- if .Values.presidio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lastmile.presidioName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lastmile.presidioSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  # Stateless: it reads each message it is sent and keeps nothing.
  replicas: 1
  selector:
    matchLabels:
      {{- include "lastmile.presidioSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lastmile.presidioSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lastmile.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presidio-analyzer
          image: "{{ .Values.presidio.image.repository }}:{{ .Values.presidio.image.tag }}"
          imagePullPolicy: {{ .Values.presidio.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.presidio.port | quote }}
            - name: WORKERS
              value: {{ .Values.presidio.workers | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.presidio.port }}
          # Loading the language model takes a minute.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.presidio.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
