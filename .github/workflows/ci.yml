name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The browser client against a real headless Chromium: the same image
      # (and version) the chart runs.
      - name: Browser client
        run: |
          image=$(yq '.browser.image.repository + ":" + .browser.image.tag' deploy/helm/lastmile/values.yaml)
          docker run -d --network host --shm-size=256m "$image"
          for i in $(seq 1 30); do curl -sf localhost:9222/json/version >/dev/null && break; sleep 1; done
          LASTMILE_TEST_BROWSER_URL=http://127.0.0.1:9222 \
            cargo test --locked --test browser -- --ignored reads_what a_page_that_never
    env:
      # The screenshot tests are ignored here; the visual job runs them.
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

  visual:
    runs-on: ubuntu-24.04
    # The same image as `make visual-docker` (browsers and fonts included),
    # so baselines rendered on any machine with Docker match CI pixel for
    # pixel. Keep its version in step with playwright-rs's driver.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Screenshots
        run: make visual
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSS is up to date
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          make css
          git diff --exit-code assets/dist/app.css

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
