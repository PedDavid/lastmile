lastmile: rule/v1
id: 9d2c4b7e-3f51-4a58-8f0e-6c1a2d7b9e40
version: 3
slug: paack-out-for-delivery
name: Paack – out for delivery (SMS)
description: Paack's text on the day of delivery, with the four digit code for the courier.
courier: Paack
match:
  all:
  - (?i)paack
  - (?i)(hoje|today)
extract:
  code: (?i)código (?:de entrega )?(?P<v>\d{4})
  tracking_number: (?i)encomenda (?P<v>PCK[A-Z0-9]+)
  tracking_url: (?P<v>https://[^\s]*paack[^\s]*)
set:
  status: out_for_delivery
  codeKind: delivery
priority: 100
samples:
- text: "Paack: A sua encomenda PCK8F3K2Q de Flor da Selva será entregue hoje entre as 14:00 e as 16:00. Código de entrega 7315. Siga em https://track.paack.app/t/‹TOKEN_1›"
  channel: share
  expected:
    code: '7315'
    code_kind: delivery
    courier: Paack
    status: out_for_delivery
    tracking_number: PCK8F3K2Q
    tracking_url: https://track.paack.app/t/‹TOKEN_1›
- text: "Paack: Olá ‹NAME_1›, a sua encomenda PCK7Q2W9D será entregue hoje em ‹ADDRESS_1›. Código de entrega 5527."
  channel: paste
  expected:
    code: '5527'
    code_kind: delivery
    courier: Paack
    status: out_for_delivery
    tracking_number: PCK7Q2W9D
